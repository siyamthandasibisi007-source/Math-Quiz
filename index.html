<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siya's Math Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #FFD93D;
    --orange: #FF6B35;
    --green: #6BCB77;
    --blue: #4D96FF;
    --purple: #C77DFF;
    --red: #FF4D6D;
    --bg: #FFF8F0;
    --dark: #2D2D2D;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background-image: 
      radial-gradient(circle at 20% 20%, #FFD93D33 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, #4D96FF33 0%, transparent 50%);
  }

  .container {
    background: white;
    border-radius: 32px;
    padding: 36px 28px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.12);
    position: relative;
    overflow: hidden;
  }

  .container::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 8px;
    background: linear-gradient(90deg, var(--yellow), var(--orange), var(--red), var(--purple), var(--blue), var(--green));
  }

  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn 0.3s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 {
    font-size: 2rem;
    font-weight: 900;
    color: var(--orange);
    text-align: center;
    margin-bottom: 6px;
  }

  .subtitle {
    text-align: center;
    color: #999;
    font-size: 0.95rem;
    font-weight: 700;
    margin-bottom: 28px;
  }

  .emoji-row {
    text-align: center;
    font-size: 2.2rem;
    margin-bottom: 20px;
    letter-spacing: 6px;
  }

  /* Inputs */
  .field-label {
    font-size: 0.9rem;
    font-weight: 800;
    color: #888;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 14px 18px;
    border: 3px solid #eee;
    border-radius: 16px;
    font-size: 1rem;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    outline: none;
    transition: border-color 0.2s;
    color: var(--dark);
    margin-bottom: 14px;
  }

  input:focus { border-color: var(--blue); }

  /* Difficulty selector */
  .difficulty-row {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }

  .diff-btn {
    flex: 1;
    padding: 12px 8px;
    border: 3px solid #eee;
    border-radius: 14px;
    background: white;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .diff-btn.selected { border-color: var(--orange); background: #FFF0EA; color: var(--orange); }
  .diff-btn:hover { border-color: var(--orange); }

  /* Buttons */
  .btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 16px;
    font-size: 1rem;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    cursor: pointer;
    margin-top: 12px;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: linear-gradient(135deg, var(--orange), var(--red));
    color: white;
    box-shadow: 0 6px 20px rgba(255,107,53,0.35);
  }

  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,107,53,0.45); }

  .btn-blue {
    background: linear-gradient(135deg, var(--blue), var(--purple));
    color: white;
    box-shadow: 0 6px 20px rgba(77,150,255,0.35);
  }

  .btn-outline {
    background: white;
    color: var(--orange);
    border: 3px solid var(--orange);
    margin-top: 8px;
  }

  /* Timer */
  .timer-wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .timer-bar {
    flex: 1;
    height: 10px;
    background: #f0f0f0;
    border-radius: 100px;
    overflow: hidden;
    margin-right: 12px;
  }

  .timer-fill {
    height: 100%;
    border-radius: 100px;
    transition: width 1s linear, background 0.5s;
    background: var(--green);
  }

  .timer-text {
    font-size: 1.1rem;
    font-weight: 900;
    color: var(--dark);
    min-width: 32px;
    text-align: right;
  }

  /* Progress */
  .progress-bar {
    background: #f0f0f0;
    border-radius: 100px;
    height: 10px;
    margin-bottom: 6px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), var(--purple));
    border-radius: 100px;
    transition: width 0.4s ease;
  }

  .progress-text {
    text-align: right;
    font-size: 0.82rem;
    color: #bbb;
    font-weight: 700;
    margin-bottom: 20px;
  }

  /* Question card */
  .question-card {
    background: linear-gradient(135deg, var(--blue), var(--purple));
    border-radius: 24px;
    padding: 28px 20px;
    text-align: center;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }

  .question-card::after {
    content: '🧮';
    position: absolute;
    right: -8px; top: -8px;
    font-size: 4.5rem;
    opacity: 0.12;
  }

  .question-label {
    color: rgba(255,255,255,0.75);
    font-size: 0.82rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .question-text {
    font-size: 2.2rem;
    font-weight: 900;
    color: white;
    line-height: 1.1;
  }

  .answer-input {
    font-size: 1.6rem !important;
    font-weight: 900 !important;
    text-align: center;
    margin-bottom: 10px !important;
  }

  /* Feedback */
  .feedback {
    border-radius: 14px;
    padding: 14px 18px;
    text-align: center;
    font-size: 1rem;
    font-weight: 800;
    margin-bottom: 12px;
    display: none;
    animation: popIn 0.3s ease;
  }

  @keyframes popIn {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .feedback.correct { background: #E8F9EE; color: #2E7D32; border: 3px solid var(--green); display: block; }
  .feedback.wrong { background: #FFF0F0; color: #C62828; border: 3px solid var(--red); display: block; }

  /* Score screen */
  .score-circle {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--yellow), var(--orange));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    box-shadow: 0 12px 36px rgba(255,107,53,0.3);
  }

  .score-number {
    font-size: 3.2rem;
    font-weight: 900;
    color: white;
    line-height: 1;
  }

  .score-label {
    color: rgba(255,255,255,0.85);
    font-size: 0.85rem;
    font-weight: 700;
  }

  .result-emoji { text-align: center; font-size: 2.8rem; margin-bottom: 8px; }
  .result-message { text-align: center; font-size: 1.15rem; font-weight: 800; color: var(--dark); margin-bottom: 4px; }
  .stars { text-align: center; font-size: 1.8rem; margin-bottom: 20px; letter-spacing: 4px; }

  /* Leaderboard */
  .leaderboard-title {
    font-size: 1.2rem;
    font-weight: 900;
    color: var(--dark);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .lb-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 14px;
    margin-bottom: 8px;
    background: #fafafa;
    border: 2px solid #f0f0f0;
    transition: all 0.2s;
  }

  .lb-item:nth-child(1) { background: #FFF9E6; border-color: var(--yellow); }
  .lb-item:nth-child(2) { background: #F5F5F5; border-color: #ccc; }
  .lb-item:nth-child(3) { background: #FFF0E6; border-color: #FFAB76; }

  .lb-rank {
    font-size: 1.2rem;
    font-weight: 900;
    min-width: 28px;
    text-align: center;
  }

  .lb-name {
    flex: 1;
    font-weight: 800;
    font-size: 0.95rem;
    color: var(--dark);
  }

  .lb-meta {
    font-size: 0.8rem;
    color: #aaa;
    font-weight: 600;
  }

  .lb-score {
    font-weight: 900;
    font-size: 1rem;
    color: var(--orange);
  }

  .lb-empty {
    text-align: center;
    color: #ccc;
    font-weight: 700;
    padding: 20px;
    font-size: 0.95rem;
  }

  .nav-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  .nav-tab {
    flex: 1;
    padding: 10px;
    border: 3px solid #eee;
    border-radius: 12px;
    background: white;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }

  .nav-tab.active { border-color: var(--orange); background: #FFF0EA; color: var(--orange); }

  .highlight { color: var(--orange); }
</style>
</head>
<body>

<div class="container">

  <!-- Welcome Screen -->
  <div class="screen active" id="welcome">
    <div class="emoji-row">🎯 📚 ✏️</div>
    <h1>Siya's Math Quiz</h1>
    <p class="subtitle">Grade R–3 · Learn & Have Fun!</p>

    <p class="field-label">Your Name</p>
    <input type="text" id="nameInput" placeholder="Enter your name..." maxlength="20" />

    <p class="field-label">Choose Difficulty</p>
    <div class="difficulty-row">
      <div class="diff-btn selected" onclick="selectDiff(this, 'easy')">
        😊<br>Easy<br><small style="font-weight:600;color:#aaa">Add & Sub</small>
      </div>
      <div class="diff-btn" onclick="selectDiff(this, 'medium')">
        🤔<br>Medium<br><small style="font-weight:600;color:#aaa">Bigger Nums</small>
      </div>
      <div class="diff-btn" onclick="selectDiff(this, 'hard')">
        🔥<br>Hard<br><small style="font-weight:600;color:#aaa">Mixed</small>
      </div>
    </div>

    <button class="btn btn-primary" onclick="startQuiz()">Start Quiz 🚀</button>
    <button class="btn btn-outline" onclick="showLeaderboard()">🏆 Leaderboard</button>
  </div>

  <!-- Quiz Screen -->
  <div class="screen" id="quiz">
    <div class="timer-wrap">
      <div class="timer-bar">
        <div class="timer-fill" id="timerFill"></div>
      </div>
      <div class="timer-text" id="timerText">15</div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
    <p class="progress-text" id="progressText">Question 1 of 5</p>

    <div class="question-card">
      <p class="question-label">Question <span id="qNum">1</span></p>
      <p class="question-text" id="questionText"></p>
    </div>

    <input class="answer-input" type="number" id="answerInput" placeholder="?" min="0" max="999" />

    <div class="feedback" id="feedback"></div>

    <button class="btn btn-primary" id="submitBtn" onclick="checkAnswer()">Submit Answer ✅</button>
  </div>

  <!-- Result Screen -->
  <div class="screen" id="result">
    <h1>Quiz Complete!</h1>
    <p class="subtitle" id="resultName"></p>

    <div class="score-circle">
      <div class="score-number" id="finalScore">0</div>
      <div class="score-label">out of 5</div>
    </div>

    <div class="stars" id="stars"></div>
    <div class="result-emoji" id="resultEmoji"></div>
    <p class="result-message" id="resultMessage"></p>

    <button class="btn btn-primary" style="margin-top:20px;" onclick="showLeaderboard()">🏆 See Leaderboard</button>
    <button class="btn btn-outline" onclick="restartQuiz()">Play Again 🔄</button>
  </div>

  <!-- Leaderboard Screen -->
  <div class="screen" id="leaderboard">
    <h1>Leaderboard</h1>
    <p class="subtitle">Top players of all time 🌍</p>

    <div class="nav-tabs">
      <div class="nav-tab active" onclick="filterLB(this, 'all')">All</div>
      <div class="nav-tab" onclick="filterLB(this, 'easy')">Easy</div>
      <div class="nav-tab" onclick="filterLB(this, 'medium')">Medium</div>
      <div class="nav-tab" onclick="filterLB(this, 'hard')">Hard</div>
    </div>

    <div id="lbList"></div>

    <button class="btn btn-primary" onclick="showScreen('welcome')">Back to Home 🏠</button>
  </div>

</div>

<script>
  // ─── Audio ───────────────────────────────────────────────
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let ctx;

  function getCtx() {
    if (!ctx) ctx = new AudioCtx();
    return ctx;
  }

  function playTone(freq, dur, type = 'sine', vol = 0.3) {
    try {
      const c = getCtx();
      const o = c.createOscillator();
      const g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
      o.start(); o.stop(c.currentTime + dur);
    } catch(e) {}
  }

  function playCorrect() {
    playTone(523, 0.12); 
    setTimeout(() => playTone(659, 0.12), 120);
    setTimeout(() => playTone(784, 0.25), 240);
  }

  function playWrong() {
    playTone(300, 0.15, 'sawtooth', 0.2);
    setTimeout(() => playTone(250, 0.2, 'sawtooth', 0.2), 150);
  }

  function playTick() { playTone(800, 0.05, 'square', 0.05); }

  function playWin() {
    [523,659,784,1047].forEach((f,i) => setTimeout(() => playTone(f, 0.2), i*120));
  }

  // ─── Questions ───────────────────────────────────────────
  const questionBank = {
    easy: [
      {q:"3 + 4 = ?", a:7}, {q:"9 - 3 = ?", a:6}, {q:"5 + 5 = ?", a:10},
      {q:"8 - 2 = ?", a:6}, {q:"4 + 3 = ?", a:7}, {q:"2 + 6 = ?", a:8},
      {q:"10 - 4 = ?", a:6}, {q:"1 + 9 = ?", a:10}, {q:"7 - 2 = ?", a:5},
      {q:"3 + 6 = ?", a:9}, {q:"8 - 5 = ?", a:3}, {q:"4 + 4 = ?", a:8},
      {q:"6 - 1 = ?", a:5}, {q:"2 + 7 = ?", a:9}, {q:"5 - 3 = ?", a:2},
    ],
    medium: [
      {q:"15 + 7 = ?", a:22}, {q:"20 - 8 = ?", a:12}, {q:"13 + 9 = ?", a:22},
      {q:"25 - 6 = ?", a:19}, {q:"18 + 4 = ?", a:22}, {q:"30 - 14 = ?", a:16},
      {q:"16 + 8 = ?", a:24}, {q:"22 - 7 = ?", a:15}, {q:"11 + 13 = ?", a:24},
      {q:"35 - 9 = ?", a:26}, {q:"14 + 6 = ?", a:20}, {q:"28 - 11 = ?", a:17},
    ],
    hard: [
      {q:"3 × 4 = ?", a:12}, {q:"2 × 7 = ?", a:14}, {q:"5 × 3 = ?", a:15},
      {q:"4 × 4 = ?", a:16}, {q:"6 × 2 = ?", a:12}, {q:"15 + 18 = ?", a:33},
      {q:"40 - 17 = ?", a:23}, {q:"3 × 6 = ?", a:18}, {q:"25 + 16 = ?", a:41},
      {q:"50 - 23 = ?", a:27}, {q:"2 × 9 = ?", a:18}, {q:"36 - 19 = ?", a:17},
    ]
  };

  // ─── State ───────────────────────────────────────────────
  let currentQ = 0, score = 0, playerName = '', difficulty = 'easy';
  let quizQuestions = [], answered = false;
  let timerInterval, timeLeft, totalTime;
  let currentLBFilter = 'all';

  // ─── Storage (shared leaderboard) ────────────────────────
  const LB_KEY = 'siya_math_quiz_leaderboard';

  function getLeaderboard() {
    try {
      return JSON.parse(localStorage.getItem(LB_KEY)) || [];
    } catch(e) { return []; }
  }

  function saveScore(name, sc, diff) {
    const lb = getLeaderboard();
    lb.push({ name, score: sc, diff, date: new Date().toLocaleDateString() });
    lb.sort((a,b) => b.score - a.score);
    localStorage.setItem(LB_KEY, JSON.stringify(lb.slice(0, 100)));
  }

  // ─── UI Helpers ──────────────────────────────────────────
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function selectDiff(el, diff) {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
    difficulty = diff;
  }

  // ─── Timer ───────────────────────────────────────────────
  function getTime() { return difficulty === 'easy' ? 15 : difficulty === 'medium' ? 20 : 25; }

  function startTimer() {
    clearInterval(timerInterval);
    totalTime = getTime();
    timeLeft = totalTime;
    updateTimerUI();
    timerInterval = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 3) playTick();
      updateTimerUI();
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        if (!answered) timeUp();
      }
    }, 1000);
  }

  function updateTimerUI() {
    const pct = (timeLeft / totalTime) * 100;
    const fill = document.getElementById('timerFill');
    const text = document.getElementById('timerText');
    fill.style.width = pct + '%';
    fill.style.background = pct > 50 ? '#6BCB77' : pct > 25 ? '#FFD93D' : '#FF4D6D';
    text.textContent = timeLeft;
    text.style.color = pct > 25 ? '#2D2D2D' : '#FF4D6D';
  }

  function timeUp() {
    answered = true;
    playWrong();
    const fb = document.getElementById('feedback');
    fb.textContent = `⏰ Time's up! The answer was ${quizQuestions[currentQ].a}`;
    fb.className = 'feedback wrong';
    document.getElementById('submitBtn').textContent = currentQ < 4 ? 'Next Question →' : 'See My Score! 🏆';
  }

  // ─── Quiz Logic ──────────────────────────────────────────
  function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

  function startQuiz() {
    const name = document.getElementById('nameInput').value.trim();
    if (!name) { alert('Please enter your name! 😊'); return; }
    playerName = name;
    currentQ = 0; score = 0; answered = false;
    quizQuestions = shuffle(questionBank[difficulty]).slice(0, 5);
    showScreen('quiz');
    loadQuestion();
  }

  function loadQuestion() {
    answered = false;
    const q = quizQuestions[currentQ];
    document.getElementById('qNum').textContent = currentQ + 1;
    document.getElementById('questionText').textContent = q.q;
    document.getElementById('progressText').textContent = `Question ${currentQ + 1} of 5`;
    document.getElementById('progressFill').style.width = `${(currentQ / 5) * 100}%`;
    document.getElementById('answerInput').value = '';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('submitBtn').textContent = 'Submit Answer ✅';
    document.getElementById('answerInput').focus();
    startTimer();
  }

  function checkAnswer() {
    if (answered) { nextQuestion(); return; }

    const input = document.getElementById('answerInput').value;
    if (input === '') { alert('Please enter an answer! 😊'); return; }

    clearInterval(timerInterval);
    answered = true;

    const userAns = parseInt(input);
    const correct = quizQuestions[currentQ].a;
    const fb = document.getElementById('feedback');

    if (userAns === correct) {
      score++;
      playCorrect();
      fb.textContent = '🎉 Correct! Well done!';
      fb.className = 'feedback correct';
    } else {
      playWrong();
      fb.textContent = `❌ Not quite! The answer was ${correct}`;
      fb.className = 'feedback wrong';
    }

    document.getElementById('submitBtn').textContent = currentQ < 4 ? 'Next Question →' : 'See My Score! 🏆';
  }

  function nextQuestion() {
    currentQ++;
    if (currentQ >= 5) showResults();
    else loadQuestion();
  }

  function showResults() {
    clearInterval(timerInterval);
    saveScore(playerName, score, difficulty);

    if (score === 5) playWin();

    document.getElementById('finalScore').textContent = score;
    document.getElementById('resultName').textContent = `Great work, ${playerName}!`;

    let stars = '';
    for (let i = 0; i < score; i++) stars += '⭐';
    document.getElementById('stars').textContent = stars || '💪 Keep practicing!';

    let emoji, msg;
    if (score === 5)      { emoji = '🏆🥇🎉'; msg = 'Perfect Score! You are a genius!'; }
    else if (score >= 4)  { emoji = '🌟😄'; msg = 'Excellent! Almost perfect!'; }
    else if (score >= 3)  { emoji = '👍😊'; msg = 'Great job! Keep practicing!'; }
    else if (score >= 2)  { emoji = '💪😌'; msg = 'Good try! You can do better!'; }
    else                  { emoji = '📚🤓'; msg = 'Keep practicing! You will get there!'; }

    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultMessage').textContent = msg;
    showScreen('result');
  }

  function restartQuiz() {
    document.getElementById('nameInput').value = '';
    showScreen('welcome');
  }

  // ─── Leaderboard ─────────────────────────────────────────
  function showLeaderboard() {
    renderLB(currentLBFilter);
    showScreen('leaderboard');
  }

  function filterLB(el, filter) {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    currentLBFilter = filter;
    renderLB(filter);
  }

  function renderLB(filter) {
    let data = getLeaderboard();
    if (filter !== 'all') data = data.filter(d => d.diff === filter);
    data = data.sort((a,b) => b.score - a.score).slice(0, 20);

    const medals = ['🥇','🥈','🥉'];
    const diffLabel = { easy:'😊 Easy', medium:'🤔 Medium', hard:'🔥 Hard' };

    const list = document.getElementById('lbList');
    if (data.length === 0) {
      list.innerHTML = '<div class="lb-empty">No scores yet! Be the first to play! 🎯</div>';
      return;
    }

    list.innerHTML = data.map((entry, i) => `
      <div class="lb-item">
        <div class="lb-rank">${medals[i] || (i+1)}</div>
        <div>
          <div class="lb-name">${entry.name}</div>
          <div class="lb-meta">${diffLabel[entry.diff] || entry.diff} · ${entry.date}</div>
        </div>
        <div class="lb-score">${entry.score}/5</div>
      </div>
    `).join('');
  }

  // ─── Keyboard ────────────────────────────────────────────
  document.addEventListener('keypress', function(e) {
    if (e.key !== 'Enter') return;
    if (document.getElementById('quiz').classList.contains('active')) checkAnswer();
    if (document.getElementById('welcome').classList.contains('active')) startQuiz();
  });
</script>
</body>
</html>
